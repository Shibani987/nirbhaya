<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us - Nirvaya</title>
    <link rel="stylesheet" href="join_styles.css">
</head>
<body class="join-us">
    <div class="overlay"></div>

    <div class="container">
        <h1 class="slide-up">Join Us</h1>
        <p class="slide-up">Be a part of the movement and help create a world where women thrive.</p>

        <form id="joinForm" class="join-form slide-up">
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Create Password" required>
            <button type="submit" class="btn">Join Now</button>
        </form>
    </div>
    <div id="successPopup" class="popup">
        <div class="popup-content">
            <p>Signup Successful! 🎉</p>
            <button onclick="closePopup()">OK</button>
        </div>
    </div>

    <script src="join_script.js"></script>
</body>
</html>
