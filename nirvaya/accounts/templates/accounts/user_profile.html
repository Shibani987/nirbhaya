{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.2/cdn.min.js" defer></script>
  <style>
    .profile-bg {
      background-color: #526db6;
      background-image: url("{% static 'accounts/img/Back_Ground.jpg' %}");
      background-blend-mode: overlay;
      background-size: cover;
      background-position: center;
      opacity: 0.9;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div class="flex flex-col w-full min-h-screen bg-slate-800 text-white">
    
    <!-- Header -->
    <div class="flex justify-between items-center p-6">
      <div class="text-lg font-bold">USER PROFILE</div>
      <div class="flex items-center gap-4">
        <!-- Search -->
        <div class="relative">
          <input type="text" placeholder="Search" class="py-2 px-4 pl-10 rounded-full bg-slate-700 text-white w-64">
          <svg class="absolute left-3 top-3 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <!-- User Avatar -->
        <div class="w-10 h-10 rounded-full bg-blue-500 overflow-hidden">
          <img src="{% static 'accounts/img/image.png' %}" alt="User Avatar" class="w-full h-full object-cover">
        </div>
        <div>Nirvaya</div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="relative p-6">
      <!-- Background Image -->
      <div class="absolute inset-0 profile-bg opacity-20 z-0"></div>

      <!-- Welcome Text -->
      <div class="relative z-10 mb-8">
        <h1 class="text-4xl font-bold mb-2">Hello {{ request.user.username }}</h1>
        <p class="text-lg">This is your profile page. You can manage your projects and track progress.</p>
        <button @click="openModal = true" class="mt-4 bg-blue-500 text-white px-6 py-2 rounded-md hover:bg-blue-600">
          Edit Profile
        </button>
      </div>

      <!-- Profile Cards -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-16">
        <!-- User Information Card -->
        <div class="bg-white rounded-lg shadow-lg p-6 text-slate-800">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-lg font-bold text-slate-600">My Account</h2>
            <button class="bg-indigo-500 text-white px-4 py-1 rounded-md">
              Settings
            </button>
          </div>

          <!-- User Details -->
          <div class="mb-6">
            <h3 class="text-sm font-semibold text-gray-500 mb-4">USER INFORMATION</h3>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1">Username</label>
                <input type="text" name="username" value="{{ request.user.username }}" class="w-full p-2 border rounded-md bg-gray-100">
              </div>
              <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" name="email" value="{{ request.user.email }}" class="w-full p-2 border rounded-md bg-gray-100">
         </div>
            </div>
          </div>

          <!-- Contact Information -->
          <div class="mb-6">
            <h3 class="text-sm font-semibold text-gray-500 mb-4">CONTACT INFORMATION</h3>
            <input type="text" value="Address" class="w-full p-2 border rounded-md bg-gray-100" readonly>
          </div>

          <!-- About Me -->
          <div>
            <h3 class="text-sm font-semibold text-gray-500 mb-4">ABOUT ME</h3>
            <textarea class="w-full p-2 border rounded-md h-24 bg-gray-100" readonly>Describe Yourself</textarea>
          </div>
        </div>

        <!-- User Card -->
        <div class="bg-white rounded-lg shadow-lg p-6 text-slate-800">
          <div class="flex justify-center relative">
            <div class="w-32 h-32 rounded-full overflow-hidden absolute -top-16 border-4 border-white">
              <img src="{% static 'accounts/img/image.png' %}" alt="Profile Image" class="w-full h-full object-cover">
            </div>
          </div>
          
          <div class="mt-20 text-center">
            <h2 class="text-lg font-bold mb-1">{{ request.user.username }}</h2>
            <p class="text-gray-500 mb-4">West Bengal,India</p>
            <div class="flex justify-center space-x-4 mb-4">
              <button class="bg-blue-500 text-white px-4 py-1 rounded-md">
                Connect
              </button>
              <button class="bg-gray-800 text-white px-4 py-1 rounded-md">
                Message
              </button>
            </div>
            <button class="text-blue-500 mt-2">
              Show more
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div x-data="{ openModal: false }">
    <div x-show="openModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex justify-center items-center">
      <div class="bg-white p-6 rounded-lg shadow-lg w-96">
        <h2 class="text-lg font-bold mb-4">Edit Profile</h2>
        <label class="block text-sm font-medium">Username</label>
        <input type="text" class="w-full p-2 border rounded-md mb-4" value="lucky.jesse">
        <label class="block text-sm font-medium">Email</label>
        <input type="email" class="w-full p-2 border rounded-md mb-4" value="jesse@example.com">
        <div class="flex justify-end space-x-2">
          <button @click="openModal = false" class="bg-gray-500 text-white px-4 py-1 rounded-md">Cancel</button>
          <button class="bg-blue-500 text-white px-4 py-1 rounded-md">Save</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
